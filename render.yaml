# Optional Render Blueprint (New + > Blueprint). Secrets are generated/entered in the dashboard, never committed.
databases:
  - name: autoverse-db
    plan: free
services:
  - type: web
    name: autoverse-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: autoverse-db, property: connectionString }
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        sync: false
